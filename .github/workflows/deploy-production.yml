name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-dgwebservices
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy DG Webservices
    if: github.ref == 'refs/heads/production'
    environment: production

    runs-on:
      - self-hosted
      - Linux
      - X64
      - dg-sites
      - production
      - dgwebservices

    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SITE_URL: https://www.dgwebservices.nl
      APP_ENVIRONMENT: production
      ALLOW_INDEXING: "false"
      APP_REVISION: ${{ github.sha }}

      # Exactly four native backoffice Variables from the existing environment.
      DGWEB_APP_ORIGIN: ${{ vars.DGWEB_APP_ORIGIN }}
      DGWEB_DATA_MODE: ${{ vars.DGWEB_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      DG_RUNTIME_ENV_KEYS: >-
        NEXT_PUBLIC_SITE_URL
        APP_ENVIRONMENT
        ALLOW_INDEXING
        APP_REVISION
        DGWEB_APP_ORIGIN
        DGWEB_DATA_MODE
        NEXT_PUBLIC_SUPABASE_URL
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify production runner
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(id -un)" = "dgwebservices"
          test "${RUNNER_NAME}" = "dg-sites-vps-01-dgwebservices-01"

          case "${GITHUB_WORKSPACE}/" in
            /srv/sites/dgwebservices/actions-runner/_work/*)
              ;;
            *)
              echo "Wrong runner workspace"
              exit 1
              ;;
          esac

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "Runner boundary OK"

      - name: Validate confirmed backoffice target
        shell: bash
        run: |
          set -Eeuo pipefail

          # Validate presence and target without printing configured values.
          node --input-type=module <<'NODE'
          const expected = {
            DGWEB_APP_ORIGIN: 'https://dgwebservices.nl/admin',
            DGWEB_DATA_MODE: 'supabase',
            NEXT_PUBLIC_SUPABASE_URL: 'https://prjvxusiqzadpaitcqxr.supabase.co',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (process.env[key] !== value) throw new Error(`Missing or unconfirmed production Variable: ${key}`);
          }
          if (!/^sb_publishable_[A-Za-z0-9_-]+$/.test(process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '')) {
            throw new Error('Missing or invalid NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY');
          }
          console.log('Confirmed backoffice runtime target present');
          NODE

      - name: Deploy production
        shell: bash
        run: |
          set -Eeuo pipefail

          /usr/local/bin/dg-site-deploy \
            dgwebservices \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify public website
        shell: bash
        run: |
          set -Eeuo pipefail

          curl \
            -fsSL \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            https://www.dgwebservices.nl/ \
            >/dev/null

          echo "DG Webservices production OK"
